
name: Build Nitro Client

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build JAR
        run: gradle build

      - name: Upload Nitro Client JAR
        uses: actions/upload-artifact@v4
        with:
          name: NitroClient-JAR
          path: build/libs/*.jar
